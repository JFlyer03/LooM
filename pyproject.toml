[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-memory-agent"
version = "0.1.0"
description = "Memory Agent workflows on reusable RL backends"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["omegaconf>=2.3,<3", "loguru>=0.7,<1"]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=15"]
judge = ["openai>=1,<3"]
memory-bank = ["numpy>=1.26", "openai>=1,<3"]
memory-db = ["numpy>=1.26", "openai>=1,<3", "neo4j>=5", "pymilvus>=2.4"]
test = ["pytest>=8,<10"]
skyrl-train = ["skyrl[fsdp]"]

[tool.setuptools.packages.find]
include = ["loom", "loom.*"]
namespaces = true

[tool.setuptools.package-data]
"loom" = ["functional/templates/*.jinja2", "tasks/swebench/scripts/**/*.sh", "tasks/swebench/scripts/**/*.py", "LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
