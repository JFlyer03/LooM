[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-memory-agent"
version = "0.1.0"
description = "Memory agents for reinforcement learning training and inference"
readme = "README.md"
requires-python = "==3.12.*"
license = {file = "LICENSE"}
dependencies = [
    "aiohttp>=3.10,<4",
    "loguru>=0.7,<1",
    "omegaconf>=2.3,<3",
    "pandas>=2.2,<4",
    "transformers>=4.51.3,<6",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=15"]
judge = ["openai>=1,<3"]
memory-bank = ["numpy>=1.26", "openai>=1,<3"]
memory-db = ["numpy>=1.26", "openai>=1,<3", "neo4j>=5", "pymilvus>=2.4"]
test = ["pytest>=8,<10"]
tinker = ["tinker", "chz", "torch", "datasets>=3.6,<6", "wandb", "faiss-cpu", "litellm>=1.63,<2"]

# Native wheels target CPython 3.12 on Linux x86_64. Keep these pins in sync with requirements/verl-cu124.in.
verl = [
    "verl==0.5.0",
    "torch @ https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp312-cp312-linux_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.21.0%2Bcu124-cp312-cp312-linux_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cu124/torchaudio-2.6.0%2Bcu124-cp312-cp312-linux_x86_64.whl",
    "vllm==0.8.5",
    "xformers==0.0.29.post2",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl",
    "transformers==4.51.3",
    "tokenizers==0.21.4",
    "peft==0.15.2",
    "ray[default,cgraph]==2.47.1",
    "tensordict==0.8.3",
    "torchdata==0.11.0",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "datasets==3.6.0",
    "opencv-python-headless==4.11.0.86",
    "litellm==1.74.15",
    "pymilvus==2.5.10",
    "neo4j>=6.1,<7",
    "setuptools==80.10.2",
    "faiss-cpu",
    "boto3",
    "sentencepiece>=0.2.1,<1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{extra = "verl"}, {extra = "tinker"}]]

[tool.setuptools.packages.find]
include = ["loom", "loom.*"]
namespaces = true

[tool.setuptools.package-data]
"loom" = ["functional/templates/*.jinja2", "integrations/verl/*.yaml", "tasks/swebench/scripts/**/*.sh", "tasks/swebench/scripts/**/*.py", "LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
