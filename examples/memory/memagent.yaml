agent_cls: loom.agents.memory.MemAgent
task: loom.tasks.memory.LongContextMemoryTask
tools: []

data:
  instance_key: instance
  instance_id_key: __loom_uid
  data_source_key: data_source

memory:
  chunk_size: 2500
  max_chunk_number: 6
  # llm_judge preserves the old loom reward's boxed-answer + external judge setup.
  # exact_match is an explicit alternative for offline checks, not an equivalent scorer.
  reward_mode: llm_judge

generator:
  infer_backend: skyrl-train
  backend_config: null
  num_trajectories: 16
  max_iterations: 7
  max_prompt_length: 6000
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 2500
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 2500
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: false

dispatcher:
  type: async_batch
  max_parallel_agents: 2
  max_eval_parallel_agents: 2
  val_config:
    max_parallel_agents: 2
    max_eval_parallel_agents: 2
