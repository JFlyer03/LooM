agent_cls: loom.agents.long_context_memory.MemAgent

task: loom.tasks.long_context_memory.LongContextMemoryTask

tools: []

data:
  instance_key: instance
  data_source_key: data_source

agent_kwargs:
  chunk_size: 2500

generator:
  infer_backend: verl
  backend_config: null
  num_trajectories: 16  # Number of trajectories per prompt for GRPO
  max_iterations: 6  # Maximum number of memory updates before the final answer
  max_prompt_length: 6000
  sampling_params:
    temperature: 1.0
    max_tokens: 2500
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.0
      max_tokens: 512
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false

dispatcher:
  type: async_batch
  max_parallel_agents: 16
  max_eval_parallel_agents: 4
